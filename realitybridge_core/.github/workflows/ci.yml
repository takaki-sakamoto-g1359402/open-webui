name: realitybridge-core-ci

on:
  push:
    paths:
      - 'realitybridge_core/**'
  pull_request:
    paths:
      - 'realitybridge_core/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realitybridge_core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: PYTHONPATH=packages/core/src:. ruff check .
      - run: PYTHONPATH=packages/core/src:. mypy packages/core/src
      - run: PYTHONPATH=packages/core/src:. pytest tests
