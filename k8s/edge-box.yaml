      labels:
        app: ota-agent
    spec:
      containers:
        - name: ota-agent
          image: edge-box/ota-agent:latest
          env:
            - name: APP_ENV
              value: development
            - name: SITE_ID
              value: alpha-site
            - name: MQTT_URL
              value: mqtt://mosquitto.edge-box:1883
          ports:
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: ota-agent
  namespace: edge-box
spec:
  selector:
    app: ota-agent
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safety-policy-service
  namespace: edge-box
spec:
  replicas: 1
  selector:
    matchLabels:
