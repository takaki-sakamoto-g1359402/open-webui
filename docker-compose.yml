version: '3'
services:
  api:
    build: .
    command: python -m aiai_p.cli.server
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
  gui:
    build: .
    command: streamlit run aiai_p/ui/app.py --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
  worker:
    build: .
    command: python -m aiai_p.cli.scheduler
    restart: always
    volumes:
      - ./data:/app/data
